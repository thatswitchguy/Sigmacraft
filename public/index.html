<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="titleScreen">
  <div class="title-container">
    <h1 class="minecraft-title">Sigmacraft</h1>
    <br>
    <div id="splashText" class="splash">Welcome!</div>
    <div align="centre" class="title-buttons">
      <button id="playBtn" class="mc-btn">Singleplayer</button>
      <button id="devModeBtn" class="mc-btn">Options</button>
      <div class="text" style="color: #fff; font-size: 20px; position: centre">v.1.3</div>
    </div>
  </div>
  <a href="credits.html" class="credits-link">Credits</a>
</div>


  <div id="devOverlay" style="display:none;">
    <div class="dev-header">
      <h2>Developer Mode</h2>
      <button id="closeDev">&times;</button>
    </div>

    <div class="dev-content">
      <div class="dev-layout">
        <div class="dev-sidebar">
          <div class="sidebar-header">
            <h4>Blocks</h4>
            <button id="addBlockBtn" class="small-btn">+</button>
          </div>
          <div id="blockSidebarList" class="sidebar-list"></div>
        </div>

        <div class="editor-main">
          <div class="editor-controls">
            <div class="control-group">
              <label>Block ID</label>
              <input type="text" id="editBlockId" readonly>
            </div>
            <div class="control-group">
              <label>Block Name</label>
              <input type="text" id="editBlockName">
            </div>
            <div class="control-group">
              <label>Side</label>
              <select id="sideSelect">
                <option value="top">Top</option>
                <option value="bottom">Bottom</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="front">Front</option>
                <option value="back">Back</option>
              </select>
            </div>
            <div class="control-group">
              <label>Tool</label>
              <div class="tool-buttons">
                <input type="color" id="colorPicker" value="#8B4513">
                <button id="fillButton">Fill All</button>
              </div>
            </div>
            <div class="control-group splash-editor-group">
              <label>Splash Text</label>
              <div class="tool-buttons">
                <input type="text" id="splashInput" class="mc-input" placeholder="Splash Text">
                <button id="saveSplashBtn">Save Splash</button>
              </div>
            </div>
          </div>

          <div class="pixel-grid-container">
            <div id="pixelGrid" class="pixel-grid"></div>
          </div>

          <div class="action-buttons">
            <button id="applyColor" class="primary-btn">Save Texture & Name</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="newBlockOverlay" style="display:none;">
    <div class="options-window">
      <h2>New Block</h2>
      <div class="control-group">
        <label>Block ID (lowercase, no spaces)</label>
        <input type="text" id="newBlockId" placeholder="e.g. mud">
      </div>
      <div class="control-group">
        <label>Block Name</label>
        <input type="text" id="newBlockName" placeholder="e.g. Mud">
      </div>
      <div class="options-footer">
        <button id="newBlockCancel" class="mc-btn">Cancel</button>
        <button id="newBlockSubmit" class="mc-btn">Create</button>
      </div>
    </div>
  </div>

<div id="optionsOverlay" style="display:none;" class="overlay-container">
  <div class="options-window">
    <h2>Options</h2>
    <div class="options-content">
      <button id="optionsSkinUpload" class="mc-btn">Upload Skin (PNG)</button>
      <input type="file" id="skinFileInput" accept="image/png" style="display:none;">
    </div>
    <div class="options-footer">
      <button id="optionsClose" class="mc-btn">Done</button>
    </div>
  </div>
</div>

<div id="itemTooltip"></div>
<div id="hotbarLabel"></div>

<div id="hotbar">
  <div class="slot selected" data-slot="0"></div>
  <div class="slot" data-slot="1"></div>
  <div class="slot" data-slot="2"></div>
  <div class="slot" data-slot="3"></div>
  <div class="slot" data-slot="4"></div>
  <div class="slot" data-slot="5"></div>
  <div class="slot" data-slot="6"></div>
  <div class="slot" data-slot="7"></div>
  <div class="slot" data-slot="8"></div>
</div>

<div id="inventoryOverlay" style="display:none;">
  <div class="inventory-window">
    <div class="inventory-header">
      <h3>Inventory</h3>
      <button id="closeInventory">&times;</button>
    </div>
    <div class="inventory-section">
      <h4>Blocks</h4>
      <div id="inventoryGrid" class="inventory-grid"></div>
    </div>
    <div id="inventoryHotbar" class="inventory-section">
      <h4>Hotbar</h4>
      <div id="hotbarSlots" class="inventory-grid"></div>
    </div>
    <div class="inventory-section" style="margin-top:10px;">
      <h4>Creative Inventory (Here until Survival mode is added)</h4>
      <div id="blockCatalog" class="inventory-grid" style="grid-template-columns: repeat(9, 1fr); max-height: 100px; overflow-y: auto;"></div>
    </div>
  </div>
</div>

<div id="crosshair"></div>

<div id="pauseMenu" style="display:none;">
  <div class="pause-window">
    <div id="pauseMain">
      <h2>Game Paused</h2>
      <div class="pause-buttons">
        <button class="mc-btn" onclick="document.getElementById('pauseMain').style.display='none';document.getElementById('pauseVideo').style.display='block';">Video</button>
        <button class="mc-btn" onclick="document.getElementById('pauseMain').style.display='none';document.getElementById('pauseGame').style.display='block';">Game</button>
        <button class="mc-btn" id="resumeBtn">Resume</button>
        <button class="mc-btn" id="quitBtn">Save and Quit to Title</button>
      </div>
    </div>
    <div id="pauseVideo" style="display:none;">
      <h2>Video Settings</h2>
      <div class="settings-group">
        <label>Framerate</label>
        <select id="framerateSelect" class="mc-select">
          <option value="30">30 FPS</option>
          <option value="60" selected>60 FPS</option>
          <option value="120">120 FPS</option>
          <option value="0">Unlimited</option>
        </select>
      </div>
      <div class="settings-group">
        <label>Brightness</label>
        <input type="range" id="brightnessSlider" min="50" max="150" value="100" class="mc-slider">
        <span id="brightnessValue">100%</span>
      </div>
      <div class="settings-group">
        <label>Contrast</label>
        <input type="range" id="contrastSlider" min="50" max="150" value="100" class="mc-slider">
        <span id="contrastValue">100%</span>
      </div>
      <button class="mc-btn" onclick="document.getElementById('pauseVideo').style.display='none';document.getElementById('pauseMain').style.display='block';">Back</button>
    </div>
    <div id="pauseGame" style="display:none;">
      <h2>Game Settings</h2>
      <div class="settings-group">
        <label>
          <input type="checkbox" id="hideHandCheck"> Hide Hand
        </label>
      </div>
      <button class="mc-btn" onclick="document.getElementById('pauseGame').style.display='none';document.getElementById('pauseMain').style.display='block';">Back</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.module.js';
  import { initGame } from './main.js';
  initGame(THREE);
</script>

</body>
</html>
