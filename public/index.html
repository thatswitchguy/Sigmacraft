<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Minecraft Node</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="devOverlay" style="display:none;">
  <div class="dev-header">
    <h2>Block Texture Editor</h2>
    <button id="closeDev">&times;</button>
  </div>
  
  <div class="dev-content">
    <div class="editor-controls">
      <div class="control-group">
        <label>Block</label>
        <select id="blockSelect"></select>
      </div>
      <div class="control-group">
        <label>Side</label>
        <select id="sideSelect">
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="front">Front</option>
          <option value="back">Back</option>
        </select>
      </div>
      <div class="control-group">
        <label>Tool</label>
        <div class="tool-buttons">
          <input type="color" id="colorPicker" value="#8B4513">
          <button id="fillButton">Fill All</button>
        </div>
      </div>
    </div>

    <div class="pixel-grid-container">
      <div id="pixelGrid" class="pixel-grid"></div>
    </div>

    <div class="action-buttons">
      <button id="applyColor" class="primary-btn">Save Texture</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.module.js';
  import { initGame } from './main.js';
  initGame(THREE);
</script>

</body>
</html>
